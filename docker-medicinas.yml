services:
  db-postgres:
    image: postgres:15-alpine
    container_name: db_telemedicina_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-telemedicina_agendamiento}
      POSTGRES_USER: ${POSTGRES_USER:-admin_telemedicina}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password_seguro_123}
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin_telemedicina -d telemedicina_agendamiento"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - red-telemedicina

  api:
    build: .
    container_name: api_telemedicina
    restart: unless-stopped
    depends_on:
      db-postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://admin_telemedicina:password_seguro_123@db-postgres:5432/telemedicina_agendamiento
      - FLASK_CONFIG=production
    ports:
      - "5000:5000"
    volumes:
      - ./:/usr/src/app
    networks:
      - red-telemedicina

networks:
  red-telemedicina:
    driver: bridge

volumes:
  datos_postgres:
    driver: local
