services:
  - type: web
    name: api-usuarios
    env: python
    plan: free
    rootDir: microservices/usuarios/servicio_usuarios
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: PYTHONPATH
        value: /opt/render/project/src

  - type: web
    name: api-agendamiento
