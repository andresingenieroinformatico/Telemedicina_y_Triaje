version: '3.8'

services:
  db-postgres:
    image: postgres:15-alpine
    container_name: db_telemedicina_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-telemedicina_agendamiento}
      POSTGRES_USER: ${POSTGRES_USER:-admin_telemedicina}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password_seguro_123}
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    networks:
      - red-telemedicina

  api:
    build: .
    container_name: api_telemedicina
    restart: unless-stopped
    depends_on:
      - db-postgres
    env_file:
      - .env
    ports:
      - "5000:5000"
    volumes:
      - ./:/usr/src/app
    entrypoint: ["/bin/sh", "-c", "/usr/src/app/scripts/start.sh"]
    networks:
      - red-telemedicina

networks:
  red-telemedicina:
    driver: bridge

volumes:
  datos_postgres:
    driver: local
