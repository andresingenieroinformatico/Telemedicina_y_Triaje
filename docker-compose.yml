version: '3.8'

services:
  db:
    image: postgres:15
    container_name: videoconferencias_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: videoconferencias
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh

  # Microservicio de Usuarios y Autenticación
  usuarios-service:
    build: ./microservices/usuarios/servicio_usuarios
    container_name: usuarios_ms
    restart: always
    ports:
      - "5002:5002"
    environment:
      - DATABASE_URL=postgresql://admin:admin123@db:5432/usuarios
      - JWT_SECRET=super-secret-key
    depends_on:
      - db

  # Microservicio de Agendamiento
  agendamiento-service:
    build: ./microservices/agendamiento
    container_name: agendamiento_ms
    restart: always
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://admin:admin123@db:5432/agendamiento
    depends_on:
      - db

  # Microservicio de Triage
  triage-service:
    build: ./microservices/triage
    container_name: triage_ms
    restart: always
    ports:
      - "5001:5001"
    environment:
      - DATABASE_URL=postgresql://admin:admin123@db:5432/triage
    depends_on:
      - db

  # Microservicio de Videoconferencias
  videoconferencias-service:
    build: ./microservices/videoconferencias
    container_name: videoconferencias_ms
    restart: always
    ports:
      - "5004:5004"
    environment:
      - DATABASE_URL=postgresql+pg8000://admin:admin123@db:5432/videoconferencias
    depends_on:
      - db

  # Microservicio de Historial Médico
  historial-service:
    build: ./microservices/historial_medico
    container_name: historial_ms
    restart: always
    ports:
      - "5003:5003"
    environment:
      - DATABASE_URL=postgresql://admin:admin123@db:5432/historial_medico
    depends_on:
      - db


volumes:
  postgres_data: