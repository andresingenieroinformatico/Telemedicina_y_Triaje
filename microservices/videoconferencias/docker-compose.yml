version: '3.8'

services:
  db:
    image: postgres:15
    container_name: videoconferencias_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: videoconferencias
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: videoconferencias_app
    restart: always
    ports:
      - "5004:5004"
    environment:
      DATABASE_URL: postgresql+pg8000://admin:admin123@db:5432/videoconferencias
    depends_on:
      - db

volumes:
  postgres_data: