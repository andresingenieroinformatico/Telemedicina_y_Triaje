      - key: PYTHON_VERSION
        value: 3.12.0

  - type: web
    name: api-video
    env: python
    rootDir: microservices/videoconferencias
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: telemedicina-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.0
